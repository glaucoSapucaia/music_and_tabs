[project]
name = "music-and-tabs"
version = "0.1.0"
description = "Pipeline de produção audiovisual com transcrição musical e publicação automatizada"
requires-python = ">=3.11"
dependencies = [
    "basic-pitch>=0.3.5",
    "setuptools>=70.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.1",
    "pretty-midi>=0.2.10",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
]

[project.scripts]
music-tabs = "main:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
